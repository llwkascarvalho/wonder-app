[flake8]
# Verificações puramente cosméticas desativadas para não conflitar com o
# estilo já usado no projeto (linhas longas em f-strings de conexão e
# prompts de IA, espaçamento entre funções). Erros que indicam problemas
# reais (imports não usados, nomes indefinidos, erros de sintaxe) continuam
# ativos normalmente.
extend-ignore =
    E501,
    E302,
    E303,
    E305,
    E221,
    E111,
    E117,
    E122,
    W292,
    W293
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    node_modules,
    wonder-mobile
